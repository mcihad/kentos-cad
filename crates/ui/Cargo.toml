[package]
name = "kentos-ui"
description = "KentOS UI: iced üzerine kurulu CBS ve CAD arayüz bileşenleri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["spatial", "fonts"]
# Yazı tipleri ikili dosyaya gömülür: IBM Plex Sans ve Mono, Inter, Plus
# Jakarta Sans, JetBrains Mono (SIL Open Font License, assets/fonts). Kapalıysa
# aileler makinede kurulu olmalıdır.
fonts = []
# CBS/CAD bileşenleri: projeksiyon, katman modeli, model alanı, ViewCube.
spatial = ["dep:glam", "dep:bytemuck"]
# Ekransız görüntü: arayüzü pencere açmadan çizip PNG'ye yazar.
snapshot = ["dep:iced_runtime", "dep:png"]

[dependencies]
iced = { workspace = true, features = ["canvas", "advanced"] }
glam = { workspace = true, optional = true }
bytemuck = { workspace = true, features = ["derive"], optional = true }
iced_runtime = { workspace = true, optional = true }
png = { workspace = true, optional = true }
