[package]
name = "kentos-application"
description = "KentOS use cases shared by HTTP, CLI and (later) MCP and the worker: identity, tenancy, projects, feature commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
kentos-contracts = { path = "../../shared/contracts", default-features = false }
kentos-geometry-core = { path = "../../shared/geometry-core" }
# A block insert's geometry is its block's objects placed (docs/adr/0144 §5): the shared core's
# expansion, objects crossing to it field for field (kentos_formats::blocks).
kentos-formats = { path = "../../shared/formats" }
kentos-postgres = { path = "../postgres" }
# File projects (docs/adr/0031): uploads are verified as KCAD v2 with the shared codec,
# hashed with SHA-256 and written to the object store with tokio's file system calls.
kentos-kcad = { path = "../../shared/kcad" }
# The sheet template library (docs/sheet/design.md §13): a template is read and checked as a
# device reads it, and the commands' types are the ones the web and the desktop send.
kentos-sheet = { path = "../../shared/sheet", default-features = false }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util"] }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
# The command catalog (tests/catalog.rs) needs the contracts' JSON Schema feature.
kentos-contracts = { path = "../../shared/contracts", default-features = false, features = ["schema"] }
# The template commands' catalog entries (tests/sheet_templates.rs).
kentos-sheet = { path = "../../shared/sheet", default-features = false, features = ["schema"] }
