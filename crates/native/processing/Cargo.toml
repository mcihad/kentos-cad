[package]
name = "kentos-processing"
description = "The desktop's processing tools (İşlemler, docs/PROCESSING.md): declared tools and models, their parameters and the runner over the native document, held to the web's by shared cases (fixtures/processing/v1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The macOS linker's note that this package's programs' __eh_frame passes 16 MB (docs/adr/1136): their unwind
# tables in DWARF mode, past what the compact table points to; unwinding still works. The note alone is quiet.
[lints.rust]
linker_messages = "allow"

# Pure Rust, native only (scripts/arch/deps.mjs, group `processing`): no Iced,
# no GPU, no runtime. The web keeps its own TypeScript tools
# (apps/web/src/processing). Corner numbering, edge lengths and the
# expressions' measures come from the shared geometry core, the expression
# language from the style core: the same code the web reaches through WASM.

[dependencies]
kentos-commands = { path = "../../shared/commands", default-features = false }
# The dated scope decision's particulars the audit facts' permit section reads (docs/adr/8063).
kentos-digital-project = { path = "../../shared/digital-project" }
kentos-domain = { path = "../domain" }
# Which modules offer each tool (docs/adr/9310): the modules' shared definition and its `ModuleSet`.
kentos-launch = { path = "../launch" }
# A storey's code as the sheets name it (EK-2 Tablo 2.14) for the audit facts' rooms (docs/adr/8064); already in the
# tree through the application.
kentos-sheet = { path = "../../shared/sheet" }
kentos-expression = { path = "../../shared/expression" }
# An audit rule's measured facts (`audit_facts`, docs/adr/8057 §36): their shape, order and rounding are the extension
# contract's (`kentos_extensions::audit_facts`), this crate measures them. Pure, without its JSON Schema's derive.
kentos-extensions = { path = "../../shared/extensions", default-features = false }
kentos-geometry-core = { path = "../../shared/geometry-core" }
# The model's mandatory rows (docs/adr/8068): `kentos_ifc::required`, read for the CAD facts.
kentos-ifc = { path = "../../shared/ifc" }
# A run's result written to a GeoPackage carries its lineage in the metadata extension (docs/adr/0511).
kentos-geopackage = { path = "../geopackage" }
# İşlemler is CBS's toolbox (docs/adr/0508): its tools read CBS's sources, topology, scenarios and addresses
# (docs/adr/8054 §11).
kentos-native-application = { path = "../application", default-features = false, features = ["mod-gis"] }
# Point clouds read whole and their results written (docs/adr/0207 §7): the machines
# of the point cloud core; the host's files do the reading and writing (files.rs).
kentos-pointcloud = { path = "../../shared/pointcloud" }
# Rasterleştir's GeoTIFF and its look (docs/adr/0207 §7, ADR 0204's writer).
kentos-formats = { path = "../../shared/formats" }
# The project's coordinate systems (Koordinat sistemine dönüştür, docs/adr/0201 §8).
kentos-project = { path = "../project" }
# Yüzey analizi and the raster tools (docs/adr/0231–0236): the jobs are the raster core's.
kentos-raster = { path = "../../shared/raster" }
# Adres arama's online providers (docs/adr/0229 §10): their requests, answers and scores; the host sends.
kentos-services = { path = "../../shared/services" }
kentos-style-core = { path = "../../shared/style-core" }
# Parameter values are JSON, as the web's dialog, history and models hold them;
# a model's steps keep their values in the order written (serde's map visitor).
serde = { workspace = true }
serde_json = { workspace = true }

# The shared cases' file values (fixtures/processing/v1/queries.json) are read
# as the dialog reads a chosen file: Tablo ekle's reader (docs/adr/0200 §7),
# the formats core above.

# The audit facts' architecture drawing is a .kcad v2 file (fixtures/audit-facts/v1/mimari.kcad), read as the other
# architecture fixtures are.
[dev-dependencies]
# The numeric base (docs/adr/9403): correctly rounded functions, the same on every platform.
kentos-num = { path = "../../shared/num" }
kentos-kcad = { path = "../../shared/kcad" }

[features]
default = ["mod-arch"]
# The CAD facts' sections and elevations with their states (docs/adr/8065): the architecture's section query. A cloud
# job's facts are the desktop's, so every build that gives facts has it.
mod-arch = ["kentos-native-application/mod-arch"]
