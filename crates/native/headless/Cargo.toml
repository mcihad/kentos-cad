[package]
name = "kentos-headless"
description = "The headless command host: a drawing without a window, its product commands by name with JSON in and out, the catalog, queries, measures and .kcad files; what the Python SDK (kentos.cad) and the MCP server stand on"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Pure Rust, native only (scripts/arch/deps.mjs, group `headless`): no UI, GPU, database,
# async runtime or network. It runs the desktop's own command handlers
# (kentos-native-application) over the native document, so a script, an agent and the
# window write the same way (TODOS.md §14–15, docs/adr/0130).
[dependencies]
# The read-only viewer core (docs/adr/8054 §8); its modules are re-exported here under their old paths.
kentos-scene-query = { path = "../scene-query" }
# The catalog with its JSON Schemas (the `schema` feature): discovery for Python and AI.
kentos-commands = { path = "../../shared/commands", default-features = false, features = ["schema"] }
kentos-domain = { path = "../domain" }
kentos-expression = { path = "../../shared/expression" }
kentos-native-application = { path = "../application", default-features = false }
kentos-project = { path = "../project" }
kentos-kcad = { path = "../../shared/kcad" }
kentos-extensions = { path = "../../shared/extensions" }
# The DXF writer and, for the PDF, the sheet core (docs/adr/0252).
kentos-formats = { path = "../../shared/formats" }
kentos-dwg = { path = "../dwg" }
kentos-plot = { path = "../plot", default-features = false }
kentos-sheet = { path = "../../shared/sheet", default-features = false }
# İşlemler, CBS's toolbox, registered with the commands (docs/adr/0508); only with CBS (docs/adr/8054 §11).
kentos-processing = { path = "../processing", optional = true }
kentos-geometry-core = { path = "../../shared/geometry-core" }
# A MapLibre style's sprite (docs/adr/0635 §9): its icons drawn with the drawing's own marker shapes.
kentos-maplibre = { path = "../../shared/maplibre" }
kentos-native-style = { path = "../style" }
tiny-skia = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
# The disciplines' commands this host runs (docs/adr/8054 §11), the application's features of the same name: a server
# or agent host built for one module compiles the core and that discipline; another's command answers that it is not
# in this build. The contracts, the command types and KCAD stay whole, so a file's other data is kept as it is.
default = ["mod-arch", "mod-map", "mod-gis", "mod-road"]
mod-arch = ["kentos-native-application/mod-arch", "kentos-plot/mod-arch"]
mod-map = ["kentos-native-application/mod-map", "kentos-plot/mod-map"]
mod-gis = ["kentos-native-application/mod-gis", "kentos-plot/mod-gis", "dep:kentos-processing"]
mod-road = ["kentos-native-application/mod-road", "kentos-plot/mod-road"]

[dev-dependencies]
miniz_oxide = { workspace = true }
kentos-geopackage = { path = "../geopackage" }
