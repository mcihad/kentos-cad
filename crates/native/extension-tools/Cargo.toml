[package]
name = "kentos-extension-tools"
description = "An extension's İşlemler tools run in its own Python process (docs/adr/8057 §7, §70): the tools read from a registry, the environment found, the run with its progress, log, output and stop, the built-in tools its code asks for; the desktop and the headless hosts (MCP, the Python library) share it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Native only (scripts/arch/deps.mjs, group `extension-tools`): the registry (extension-host), the processes
# (python-env) and İşlemler (processing) over the headless host; no window, runtime, database or network. Not inside
# kentos-headless: that host stays pure, and starting an extension's process is a host's business (its entry point
# offers the tools, docs/adr/8057 §70).
[dependencies]
kentos-commands = { path = "../../shared/commands", default-features = false }
kentos-domain = { path = "../domain" }
kentos-extension-host = { path = "../extension-host" }
# An audit rule's examples, read from its package (docs/adr/8057 §75).
kentos-extensions = { path = "../../shared/extensions" }
# A built-in tool an extension's code asks for runs on a drawing of its own (docs/adr/8057 §47): CBS's processing
# commands, the only discipline extensions' tools belong to.
kentos-headless = { path = "../headless", default-features = false, features = ["mod-gis"] }
kentos-processing = { path = "../processing" }
kentos-project = { path = "../project" }
kentos-python-env = { path = "../python-env" }
serde_json = { workspace = true }

