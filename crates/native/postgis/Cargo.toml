[package]
name = "kentos-postgis"
description = "A bound layer's PostGIS provider: a database's tables read and edited in one transaction, over sqlx with TLS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Native only (scripts/arch/deps.mjs, group `postgis`; docs/adr/0505): the product commands' TableProvider for PostGIS,
# registered by the hosts (desktop, headless, Python, MCP). sqlx with rustls and the system's root certificates (the
# owner's choice, 17 Oct 2026); a runtime of its own, so the commands stay synchronous. The device's connections
# (docs/adr/0623) are serde's JSON.
[dependencies]
kentos-contracts = { path = "../../shared/contracts" }
kentos-geopackage = { path = "../geopackage" }
kentos-native-application = { path = "../application" }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["tls-rustls-ring-native-roots"] }
tokio = { workspace = true }

[dev-dependencies]
kentos-commands = { path = "../../shared/commands", default-features = false }
kentos-domain = { path = "../domain" }
kentos-headless = { path = "../headless" }
kentos-processing = { path = "../processing" }
