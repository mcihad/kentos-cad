[package]
name = "kentos-interaction"
description = "The desktop's tool session: tool states, prompts as data, typed and clicked points, confirm, cancel and step undo, as the web's tools behave (docs/adr/0018, 0021)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The macOS linker's note that this package's programs' __eh_frame passes 16 MB (docs/adr/1136): their unwind
# tables in DWARF mode, past what the compact table points to; unwinding still works. The note alone is quiet.
[lints.rust]
linker_messages = "allow"

# Pure Rust, native only (TODOS.md §2.1 `native/interaction`): no Iced, no GPU,
# no runtime (scripts/arch/deps.mjs, group `interaction`). The web keeps its
# own TypeScript session (apps/web/src/tools). The geometry comes from the
# shared core; a finished object is written through a product command
# (native/application, docs/adr/0022) over the native document.

[dependencies]
# The numeric base (docs/adr/9403): correctly rounded functions, the same on every platform.
kentos-num = { path = "../../shared/num" }
# The read-only viewer core (docs/adr/8054 §8); its modules are re-exported here under their old paths.
kentos-scene-query = { path = "../scene-query" }
kentos-commands = { path = "../../shared/commands", default-features = false }
kentos-geometry-core = { path = "../../shared/geometry-core" }
# The model quality control form's header (EK-9, docs/adr/8047 §10).
kentos-ifc = { path = "../../shared/ifc" }
kentos-domain = { path = "../domain" }
kentos-native-application = { path = "../application" }
kentos-project = { path = "../project" }
# A network analysis' run as values (docs/adr/9334): already in every program through kentos-commands and kentos-domain.
serde_json = { workspace = true }

# The shared cases' JSON in tests (fixtures/gnss/v1/import.json).
[dev-dependencies]
serde = { workspace = true }
