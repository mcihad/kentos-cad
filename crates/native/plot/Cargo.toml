[package]
name = "kentos-plot"
description = "A drawing on paper: the sheet book's maps as vectors through the style engine, the sheets' inputs and the PDF's faces, shared by the desktop and the headless command host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Pure Rust, native only (scripts/arch/deps.mjs, group `plot`; docs/adr/0252): no UI, GPU,
# database, async runtime or network. The desktop's sheet PDF and the headless host's
# (Python, MCP) draw a map from the same paths, the same tables and legends, the same faces.
[dependencies]
kentos-commands = { path = "../../shared/commands", default-features = false }
kentos-contracts = { path = "../../shared/contracts", default-features = false }
kentos-domain = { path = "../domain" }
kentos-geometry-core = { path = "../../shared/geometry-core" }
# The labels', texts' and storeys' looks as the screen draws them (docs/adr/8054 §8, §11): the read-only viewer core,
# not the tool session.
kentos-scene-query = { path = "../scene-query" }
kentos-native-application = { path = "../application", default-features = false }
kentos-native-style = { path = "../style" }
kentos-project = { path = "../project" }
kentos-sheet = { path = "../../shared/sheet", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
roxmltree = { workspace = true }
ttf-parser = { workspace = true }
rustybuzz = "=0.20.1"
png = { workspace = true }
resvg = { workspace = true, features = ["text", "raster-images"] }

[features]
# The disciplines' parts of a sheet (docs/adr/8054 §11): CBS's linked sources in an atlas, road design's alignments on a
# map and its stale drawings in the preflight. Each is the application's feature of the same name.
default = ["mod-arch", "mod-map", "mod-gis", "mod-road"]
mod-arch = ["kentos-native-application/mod-arch"]
mod-map = ["kentos-native-application/mod-map"]
mod-gis = ["kentos-native-application/mod-gis"]
mod-road = ["kentos-native-application/mod-road"]

[dev-dependencies]
# Inflating the PDF's streams in the tests' own reader (tests/support/files.rs).
miniz_oxide = { workspace = true }
