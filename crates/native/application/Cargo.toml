[package]
name = "kentos-native-application"
description = "The desktop's product commands (docs/adr/0013, 0022): typed, versioned operations over the native document, held to the web's own handlers by shared cases"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Pure Rust, native only (TODOS.md §2.1 `native/application`): no UI, GPU, database,
# async runtime or network (scripts/arch/deps.mjs, group `application`). The web runs
# its own TypeScript handlers (apps/web/src/product); this crate is never built for the
# browser. The package is not `kentos-application`: that name is the server's use cases.
[dependencies]
kentos-contracts = { path = "../../shared/contracts", default-features = false }
kentos-domain = { path = "../domain" }
# Patlat (docs/adr/0302): a dimension exploded writes its value as the project shows it (the project's Format).
kentos-project = { path = "../project" }
kentos-geopackage = { path = "../geopackage" }
# The shared geometry core: what a transform does to each kind of object (docs/adr/0037),
# the same code the web reaches through WASM.
kentos-geometry-core = { path = "../../shared/geometry-core" }
# Katman süzgeci (docs/adr/0211 §3): the expression language, evaluated as İfadeyle seç evaluates a condition.
kentos-expression = { path = "../../shared/expression" }
# The forms core (docs/adr/0401): a form's preflight, rules and a record's validation.
kentos-forms = { path = "../../shared/forms" }
# Katman stili's renderers (docs/adr/0213 §5): the style core's rules of a renderer, the web's through WASM.
kentos-style-core = { path = "../../shared/style-core" }
# The style library and its .kstil file (cad.library.edit, docs/adr/0314 §3).
kentos-style-library = { path = "../style-library" }
# Etiket motoru (docs/adr/0212 §3.1): the layers' labelling goes to the geometry core as the contract's JSON, as
# the web sends it (one reader in the core for both).
# Pafta kitabı (docs/adr/0252 §2): the sheet core's operations, the ones the sheet designer makes.
kentos-sheet = { path = "../../shared/sheet", default-features = false }
# DXF içe aktar (docs/adr/0257 §3): `file.import.dxf` reads the file with the shared reader, as the window does.
kentos-formats = { path = "../../shared/formats" }
# Blocks from a drawing file (file.import.block, docs/adr/0316 §3): the .kcad codec reads it.
kentos-kcad = { path = "../../shared/kcad" }
# A linked table's file digest (docs/adr/0327 §5): SHA-256, the workspace's locked `sha2`.
sha2 = { workspace = true }
# STAC discovery and preparation (docs/adr/0528): the services core's rules; the fetch is the host's.
kentos-services = { path = "../../shared/services" }
# The protocol's wrapper (docs/adr/0253) reads every command's input as the type it is.
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The command catalog (tests/catalog.rs) needs the contracts' JSON Schema feature, as
# the server's catalog test does.
kentos-contracts = { path = "../../shared/contracts", default-features = false, features = ["schema"] }
# The processing commands' shared cases run İşlemler's tools (docs/adr/0508); the crate is above this one, so only the
# integration tests (one copy of this crate) link it.
kentos-processing = { path = "../processing" }
