[package]
name = "kentos-python"
description = "The CPython extension kentos._native: the headless command host (kentos-headless) under the Python SDK kentos.cad"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The macOS linker's note that this package's programs' __eh_frame passes 16 MB (docs/adr/1136): their unwind
# tables in DWARF mode, past what the compact table points to; unwinding still works. The note alone is quiet.
[lints.rust]
linker_messages = "allow"

# Built by maturin from python/pyproject.toml into the package `kentos` (docs/adr/0131). Not in
# default-members: it links a Python, which web and server work does not need; its tests run
# from Python (scripts/python/test.sh). scripts/arch/deps.mjs, group `python`: the only native
# crate that may use pyo3.

[lib]
name = "kentos_python"
crate-type = ["cdylib"]

[dependencies]
kentos-postgis = { path = "../postgis" }
# The data drivers of data layers (docs/adr/9100): registered at the start, as the desktop registers them.
kentos-data-gpkg = { path = "../data-gpkg" }
kentos-data-postgis = { path = "../data-postgis" }
kentos-commands = { path = "../../shared/commands", default-features = false }
kentos-headless = { path = "../headless" }
# kentos.services (docs/adr/0208 §15): the map services' core, the project's systems and the transforms.
kentos-services = { path = "../../shared/services" }
kentos-project = { path = "../project" }
kentos-geometry-core = { path = "../../shared/geometry-core" }
# kentos.network (docs/adr/0209 §11): a project's network built from the drawing as the İşlemler tools build it.
kentos-processing = { path = "../processing" }
# The user's installed extensions' İşlemler tools that declare headless-python, run in their own processes as on the
# desktop (docs/adr/8057 §70): offered at the first drawing.
kentos-extension-tools = { path = "../extension-tools" }
# kentos.temporal (docs/adr/0210 §11): a temporal layer's objects and their persistent ids.
kentos-domain = { path = "../domain" }
# kentos.address (docs/adr/0229 §14): a project's address data read from the drawing as the apps read it.
kentos-native-application = { path = "../application" }
pyo3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
