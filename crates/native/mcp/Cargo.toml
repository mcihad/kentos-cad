[package]
name = "kentos-mcp"
description = "KentOS's MCP server: the command catalog's drawing commands, a drawing's queries and its .kcad files as tools for AI agents, over stdio, on the headless command host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Rust over stdin and stdout (scripts/arch/deps.mjs, group `mcp`): no UI or database. The
# drawing tools are pure; the server's go through the desktop's cloud client (its own runtime,
# docs/adr/0134). JSON-RPC and MCP are written here from the specification (docs/adr/0133).
[[bin]]
name = "kentos-mcp"
path = "src/main.rs"

[dependencies]
kentos-postgis = { path = "../postgis" }
kentos-commands = { path = "../../shared/commands", default-features = false, features = ["schema"] }
kentos-domain = { path = "../domain" }
kentos-headless = { path = "../headless", default-features = false }
# STAC searches (docs/adr/0528 §2): the host registers the cloud client's HTTP fetcher with the commands.
kentos-native-application = { path = "../application", default-features = false }
# The server's commands (docs/adr/0134): the desktop's cloud client, on its own runtime.
kentos-cloud = { path = "../cloud" }
# The installed extensions an agent reads and hears about (kentos://extensions/installed, plan/eklenti.md ADIM 18): the
# user's registry, read only; no extension code runs here.
kentos-extension-host = { path = "../extension-host" }
serde_json = { workspace = true }

[features]
# The disciplines whose commands the server offers (docs/adr/8054 §11): a server built for one module compiles the core
# and that discipline; the catalog stays whole and another's command answers that it is not in this build.
default = ["mod-arch", "mod-map", "mod-gis", "mod-road"]
mod-arch = ["kentos-headless/mod-arch", "kentos-native-application/mod-arch"]
mod-map = ["kentos-headless/mod-map", "kentos-native-application/mod-map"]
mod-gis = ["kentos-headless/mod-gis", "kentos-native-application/mod-gis"]
mod-road = ["kentos-headless/mod-road", "kentos-native-application/mod-road"]

[dev-dependencies]
# Installing the shared extension fixture into a test's registry (tests/mcp.rs).
kentos-extensions = { path = "../../shared/extensions" }
# Writing a shared cases' drawing to a file the tools open (tests/road_structures.rs).
kentos-kcad = { path = "../../shared/kcad" }
# Inflating the PDF's streams in the acceptance test's own reader (the plotter's tests/support/files.rs).
miniz_oxide = { workspace = true }
