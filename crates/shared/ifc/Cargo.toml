[package]
name = "kentos-ifc"
description = "KentOS's IFC (ISO 16739, IFC 4.3): writing a project's road alignments and its building as ISO 10303-21 files, the 2026 digital project regulation's IFC classes, names and properties (EK-5, EK-6), and later reading IFC files, checking a model (EK-9) and IDS; one core for the desktop, the server and the web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Pure, like the other shared cores (CLAUDE.md §14): no file system, network or UI. The application gives it its model
# (the section model's solids, its openings, the drawing's objects and settings) and writes the text it returns.
[dependencies]
# The numeric base (docs/adr/9403): correctly rounded functions, the same on every platform.
kentos-num = { path = "../num" }
kentos-contracts = { path = "../contracts", default-features = false }
# The regulation's data model (sources, levels, decisions, the profile's layers) and its 2D annexes (docs/adr/8062).
kentos-digital-project = { path = "../digital-project" }
kentos-geometry-core = { path = "../geometry-core" }
kentos-road = { path = "../road" }
# BCF (docs/adr/8103): a zip of XML files, both read and written here without touching the file system.
kentos-zip = { path = "../zip" }
roxmltree = { workspace = true }
libm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The reading engine (docs/adr/8061 §1, §7, §9, §11): MPL-2.0, unmodified, pinned. Its name appears in this file alone
# (a test keeps it so) and its types never on this crate's surface: `read` is the reading face over its STEP parser,
# `geometry` adds its triangulation for the bodies of a file read. Both are off by default, so the writer and the
# catalogue stay as small and pure as they were.
ifc-lite-core = { version = "=28.3.0", optional = true }
ifc-lite-geometry = { version = "=28.3.0", optional = true }
rustc-hash = { version = "2", optional = true }
# The model viewer's core (docs/adr/8073 §1): `view` turns a file read into its input.
kentos-model-view = { path = "../model-view", optional = true }

[features]
read = ["dep:ifc-lite-core"]
geometry = ["read", "dep:ifc-lite-geometry", "dep:rustc-hash"]
view = ["geometry", "dep:kentos-model-view"]
