# A raster must work out to the same samples on every target (the desktop's
# processing thread natively, the browser's analysis worker in WASM; CLAUDE.md
# §23.4, docs/adr/0231): the std transcendental functions call the platform's
# C library natively, so they are forbidden here; use libm.
disallowed-methods = [
  { path = "f64::sin", reason = "use libm::sin" },
  { path = "f64::cos", reason = "use libm::cos" },
  { path = "f64::tan", reason = "use libm" },
  { path = "f64::sin_cos", reason = "use libm::sin and libm::cos" },
  { path = "f64::asin", reason = "use libm" },
  { path = "f64::acos", reason = "use libm" },
  { path = "f64::atan", reason = "use libm" },
  { path = "f64::atan2", reason = "use libm::atan2" },
  { path = "f64::hypot", reason = "use libm::hypot" },
  { path = "f64::exp", reason = "use libm" },
  { path = "f64::ln", reason = "use libm" },
  { path = "f64::log10", reason = "use libm" },
  { path = "f64::powf", reason = "use libm" },
  { path = "f64::powi", reason = "write the product" },
  { path = "f64::mul_add", reason = "no fused multiply-add: both targets must round alike" },
]
