[package]
name = "kentos-geometry-core"
description = "Pure analytic CAD geometry shared by the browser (WASM) and the server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Pure dependencies only: this crate must build for every target (native,
# wasm32) and never reach for the file system, the network or a runtime
# (CLAUDE.md §14). rust_decimal carries exact decimals for the numeric
# policy (§23); libm gives every target the same transcendental functions
# (§23.4). Objects cross the WASM boundary through the crate's own small
# JSON module (api/json.rs, docs/adr/0008); serde is only for the tests.
[dependencies]
rust_decimal = { workspace = true }
libm = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
