[package]
name = "kentos-commands"
description = "The product commands' versioned input, output and plan types, their catalog and capabilities"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Everything below the commands: the document, entities, settings, the catalog's descriptors. Re-exported whole, so
# a host names both through `kentos_commands`.
kentos-contracts = { path = "../contracts", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
libm = { workspace = true }
ts-rs = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
kentos-sheet = { path = "../sheet", default-features = false, optional = true }

[features]
default = ["ts", "schema"]
ts = ["dep:ts-rs", "kentos-contracts/ts"]
schema = ["dep:schemars", "kentos-contracts/schema", "dep:kentos-sheet", "kentos-sheet/schema"]
