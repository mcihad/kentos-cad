[package]
name = "kentos-formats"
description = "File formats of KentOS (coordinate lists, DXF, GeoJSON, Shapefile): readers and writers shared by the browser (WASM) and the server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Pure dependencies only, like the geometry core: this crate builds for every
# target (native for the server's import job, wasm32 for the browser's
# formats worker) and never reaches for the file system or the network
# (CLAUDE.md §14). The objects it reads and writes are the versioned
# contracts; what the app itself computes (a bulged ring as points, ring
# area, point in ring) comes from the shared geometry core, so an imported
# hatch is sampled as the app samples its own; libm gives both targets the
# same transcendental functions, so an imported file gets the same
# coordinates in the browser and on the server (§23.4, docs/adr/0008, 0009).
[dependencies]
kentos-contracts = { path = "../contracts", default-features = false }
kentos-geometry-core = { path = "../geometry-core" }
libm = { workspace = true }
miniz_oxide = { workspace = true }
# Trimble JobXML field books (docs/adr/0169 §1, step 5c) and GPX (step 6) are XML;
# roxmltree reads them on both targets (the owner's approval for the shared
# formats core, so the web's WASM too, 2026-10-04; the desktop has had it since
# 2026-09-27, docs/deps/README.md).
roxmltree = { workspace = true }
# A GeoPackage's WebP tiles (docs/adr/0627 §1; the owner's approval for CBS-03, October 2026).
# Only the raster codec reads them.
image-webp = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# JPEG-compressed TIFF blocks in the raster tests (docs/adr/0204 §1): the host decodes
# them; in the tests that host is the desktop's decoder. Not in the WASM module.
zune-jpeg = { workspace = true }

# One feature a codec (docs/adr/8054 §11): the viewer core (`kentos-scene-query`, the renderer, a phone) takes the
# crate with none of them, so it compiles the objects' own rules (blocks, walls, spaces, openings, grids, units,
# numbers, texts, reports) without the heavy readers and writers. `default` is every codec: every other dependent
# and every full build reads and writes exactly what it did before. Without a codec its module is absent; the hosts
# that dispatch on a file's kind decide what to say of it.
[features]
default = [
    "dxf",
    "geojson",
    "shapefile",
    "kml",
    "gnss",
    "field-book",
    "landxml",
    "pdf",
    "raster",
    "multidim",
    "parquet",
    "sld",
    "spreadsheet",
]
# ASCII DXF in and out (`dxf`).
dxf = []
# GeoJSON in and out (`geojson`).
geojson = []
# ESRI Shapefile in and out (`shp`).
shapefile = []
# KML and KMZ in and out (`kml`).
kml = []
# GNSS files: GPX and NMEA positions, RINEX headers, GVX vectors; GPX out (`gnss`).
gnss = []
# Total stations' field books in (GSI, SDR, GTS-7, Nikon RAW, JobXML, CSV) and their coordinate files out (`field`).
field-book = []
# LandXML surfaces in, a road project's LandXML out (`landxml`, `landxml_write`).
landxml = []
# The PDF underlay reader (`pdf`).
pdf = []
# Raster layers' files: GeoTIFF, PNG, JPEG, WebP, VRT, GeoPackage tiles (`raster`, with `compress`, and the mesh and
# NetCDF model its reader draws: `multidim::{mesh, ugrid, cf, netcdf}`).
raster = ["dep:image-webp"]
# NetCDF, HDF5, GRIB, Zarr and SMS files read and written (the rest of `multidim`), shown through the raster codec.
multidim = ["raster"]
# Apache Parquet (`parquet`, with `compress`).
parquet = []
# Style files: SLD, and the labels, expressions and symbol layers QML and MapLibre share with it (`sld`, `style_*`).
sld = []
# Spreadsheets: CSV, XLSX and ODS tables in (`table_file`, `xml_scan`) and out (`workbook`).
spreadsheet = []
