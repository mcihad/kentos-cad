[package]
name = "kentos-zip"
description = "Zip archives in and out, bounded against hostile archives: a zipped Shapefile's files, an office file, a .kek extension package"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Its own crate (docs/adr/8057 §1): a .kek package's inspector reads zips too, and should not carry the file formats'
# geometry and contracts for it. Pure like them: inflate and deflate are miniz_oxide's, it builds for the browser (WASM)
# and never touches the file system. kentos-formats gives it on as `kentos_formats::zip`.

[dependencies]
miniz_oxide = { workspace = true }
