[package]
name = "kentos-road"
description = "KentOS Yol's engineering core (plan/road.md): the terrain surface (a constrained Delaunay TIN), and later the alignments, profiles, sections and earthworks; one core for the desktop, the server, Python and KentOS Harita's zoning plans"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Pure, like the other shared cores (CLAUDE.md §14): no file system, network or UI. Its decisions are the geometry
# core's exact predicates (ADR 0232 §4); the numbers it reads and writes are metres in the project's plane.
[dependencies]
kentos-geometry-core = { path = "../geometry-core" }
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
