[package]
name = "kentos-style-core"
description = "The KentOS style engine's core: the style compiler (symbols on geometry, renderers, a layer's GPU batches), shared by the browser (WASM) and the server; the expression language comes from kentos-expression"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Pure dependencies only, like the geometry core (CLAUDE.md §14): this crate
# builds for every target and never reaches for the file system, the network
# or a runtime. It uses the geometry core's JavaScript number semantics and
# call table (docs/adr/0008).
[dependencies]
# The numeric base (docs/adr/9403): correctly rounded functions, the same on every platform.
kentos-num = { path = "../num" }
kentos-geometry-core = { path = "../geometry-core" }
# The expression language (docs/adr/0100), re-exported as `expr` and `js`.
kentos-expression = { path = "../expression" }

[dev-dependencies]
serde_json = { workspace = true }
