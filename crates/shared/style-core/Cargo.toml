[package]
name = "kentos-style-core"
description = "The KentOS style engine's core: the expression language and the style compiler (symbols on geometry, renderers, a layer's GPU batches), shared by the browser (WASM) and the server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Pure dependencies only, like the geometry core (CLAUDE.md §14): this crate
# builds for every target and never reaches for the file system, the network
# or a runtime. It uses the geometry core's JavaScript number semantics and
# call table (docs/adr/0008).
[dependencies]
kentos-geometry-core = { path = "../geometry-core" }

[dev-dependencies]
serde_json = { workspace = true }
