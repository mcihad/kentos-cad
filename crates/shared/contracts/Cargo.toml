[package]
name = "kentos-contracts"
description = "Versioned KentOS data contracts; the TypeScript types are generated from them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# Only for generating the TypeScript types (the web app); the desktop app and the
# server build without it.
ts-rs = { workspace = true, optional = true }

[features]
default = ["ts"]
ts = ["dep:ts-rs"]
