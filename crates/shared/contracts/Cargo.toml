[package]
name = "kentos-contracts"
description = "Versioned KentOS data contracts; the TypeScript types are generated from them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# The persistent ids of a v1 drawing's objects (`identity`, docs/adr/0014): sha256 of the
# canonical text, UUIDv5 over SHA-1. Pure Rust, every target.
sha1 = { workspace = true }
sha2 = { workspace = true }
# Only for generating the TypeScript types (the web app); the desktop app and the
# server build without it.
ts-rs = { workspace = true, optional = true }
# JSON Schema of the contract types (the product command catalog, docs/adr/0013); like
# `ts`, on by default and left out by libraries that only need the Rust types.
schemars = { workspace = true, optional = true }

[features]
default = ["ts", "schema"]
ts = ["dep:ts-rs"]
schema = ["dep:schemars"]
