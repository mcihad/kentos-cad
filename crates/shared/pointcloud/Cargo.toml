[package]
name = "kentos-pointcloud"
description = "Point clouds of KentOS (docs/adr/0207): LAS, LAZ, COPC and text clouds read in pieces, their COPC index, looks, virtual clouds and operations; shared by the desktop (natively) and the web (WASM)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Pure like the formats core it builds on: no file system, network or runtime. A reader
# says which bytes it needs and the host reads them (a file, a URL's ranges, the browser's
# file slices); the index builder and the operations hand out the bytes to write.
[dependencies]
kentos-contracts = { path = "../contracts", default-features = false }
kentos-geometry-core = { path = "../geometry-core" }
# The byte store and steps of the sans-IO readers, the raster ramps, the GeoTIFF writer.
kentos-formats = { path = "../formats" }
laz = { workspace = true }
libm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
