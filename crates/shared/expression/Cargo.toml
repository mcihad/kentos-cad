[package]
name = "kentos-expression"
description = "The KentOS expression language: fields, geometry values and functions over objects, compiled once and evaluated over whole columns; shared by the browser (WASM), the desktop and the server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Pure dependencies only, like the geometry core (CLAUDE.md §14): this crate
# builds for every target and never reaches for the file system, the network
# or a runtime. It uses the geometry core's JavaScript number semantics and
# geometry (docs/adr/0008, docs/adr/0100).
[dependencies]
kentos-geometry-core = { path = "../geometry-core" }
# The regular expression functions (docs/adr/0214 §2.4): rust-lang's small engine.
regex-lite = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
