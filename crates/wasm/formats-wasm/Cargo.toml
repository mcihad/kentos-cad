[package]
name = "kentos-formats-wasm"
description = "KentOS file formats for the browser: the formats worker's wasm-bindgen boundary, loaded only when a file is imported or exported"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kentos-contracts = { path = "../../shared/contracts", default-features = false }
kentos-formats = { path = "../../shared/formats" }
# Raster oturt's transforms (docs/adr/0204 §6).
kentos-geometry-core = { path = "../../shared/geometry-core" }
# The project file, .kcad v2 (docs/specs/kcad-v2.md, docs/adr/0025).
kentos-kcad = { path = "../../shared/kcad" }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }
