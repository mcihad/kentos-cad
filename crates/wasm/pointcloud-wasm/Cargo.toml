[package]
name = "kentos-pointcloud-wasm"
description = "KentOS point clouds for the browser: the point cloud worker's wasm-bindgen boundary, loaded only when a point cloud is added or drawn (docs/adr/0207)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Empty until the web's worker is made (src/lib.rs): its dependencies (kentos-pointcloud, wasm-bindgen …) come with
# its code. Listed before, they were compiled for nothing, and Rust 1.100's `cargo::unused_dependencies` says so
# (docs/adr/8055 §2).
[dependencies]
