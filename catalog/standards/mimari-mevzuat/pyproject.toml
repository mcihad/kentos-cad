# Türkiye imar ve yangın mevzuatının mimari denetimi: KentOS'un ortak Python kuralları (plan/bim-plan.md K10). Kitaplık
# kullanmaz; yalnız Python'un kendisi ve KentOS'un verdiği `kentos.ext`. `uv lock` uv.lock'u buradan yazar.
[project]
name = "mimari-mevzuat"
version = "0.47.0"
description = "Türkiye imar ve yangın mevzuatının KentOS mimari denetimi: başvuru gününde yürürlükte olan kural seti"
requires-python = ">=3.12,<3.16"
dependencies = []

[tool.uv]
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
