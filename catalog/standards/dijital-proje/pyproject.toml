# Dijital proje yönetmeliğinin denetimleri: KentOS'un ortak Python kuralları (plan/bim-plan.md K10). Kitaplık
# kullanmaz; yalnız Python'un kendisi ve KentOS'un verdiği `kentos.ext`. `uv lock` uv.lock'u buradan yazar.
[project]
name = "dijital-proje"
version = "0.9.0"
description = "Dijital proje yönetmeliğinin KentOS denetimleri: dijital teslim kapsamı, EK-3 ve EK-4, paftaların modelden üretildiği, 2B ruhsat paketi"
requires-python = ">=3.12,<3.16"
dependencies = []

[tool.uv]
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
