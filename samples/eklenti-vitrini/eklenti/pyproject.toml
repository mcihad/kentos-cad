# Eklenti Vitrini'nin Python tarafı. Kütüphaneleri eklentinin kilidi seçer, KentOS değil: TAKS aracı shapely'nin 2.0
# serisini ve NumPy'yi kullanır. `uv lock` uv.lock'u buradan yazar.
[project]
name = "vitrin"
version = "1.0.3"
description = "KentOS Eklenti Vitrini'nin işlevleri"
requires-python = ">=3.12,<3.14"
dependencies = ["shapely>=2.0,<2.1", "numpy>=2.0,<3"]

[tool.uv]
# Manifestin adını verdiği üç sistem için çözülür ve tekerlek ister (compatibility.operatingSystems).
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
