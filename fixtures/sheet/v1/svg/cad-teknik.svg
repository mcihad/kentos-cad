<text x="30000" y="246820" font-family="Barlow, sans-serif" font-size="2400" font-weight="400" fill="#000000" xml:space="preserve">2. Çizim üzerinden ölçü alınmaz; yazılı ölçüler esastır.</text>
<text x="30000" y="250060" font-family="Barlow, sans-serif" font-size="2400" font-weight="400" fill="#000000" xml:space="preserve">3. Bu pafta ilgili mevzuata göre denetlenmeden uygulamaya esas alınamaz.</text>
