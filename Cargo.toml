# KentOS Rust workspace (CLAUDE.md §14). crates/shared: platform-neutral libraries
# (geometry core, contracts, file formats) that the web app (through crates/wasm), the
# server (crates/server, apps/api) and the future desktop app share.
[workspace]
resolver = "3"
members = [
    # Platform-neutral libraries: the web app, the server and the desktop app share them.
    "crates/shared/geometry-core",
    "crates/shared/contracts",
    "crates/shared/formats",
    "crates/shared/style-core",
    # Browser bindings (wasm-bindgen) of the shared libraries.
    "crates/wasm/geometry-wasm",
    "crates/wasm/formats-wasm",
    # Server-only libraries: PostgreSQL/PostGIS and the use cases.
    "crates/server/postgres",
    "crates/server/application",
    # Executables.
    "apps/api",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

# Exact versions: adding or bumping a dependency is a decision (CLAUDE.md §3).
[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
# float_roundtrip: parsed floats are exact (the default parser may be one ulp off), so
# coordinates cross the WASM boundary and files bit for bit (docs/adr/0008).
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
# Transcendental functions of the geometry core: the same code on every target, so native
# and WASM agree bit for bit (CLAUDE.md §23.4, docs/adr/0008).
libm = "=0.2.16"
rust_decimal = { version = "=1.43.0", default-features = false, features = ["std"] }
ts-rs = { version = "=12.0.1", features = ["serde-json-impl"] }
wasm-bindgen = "=0.2.128"
axum = { version = "=0.8.9", features = ["ws"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
# Faz B (docs/adr/0006, 0007): PostgreSQL/PostGIS, HTTP middleware, identity.
# Database TLS is off for the local server; production enables a TLS feature (ADR 0006).
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "macros", "migrate", "uuid", "json", "time"] }
tower = { version = "=0.5.3", features = ["util"] }
tower-http = { version = "=0.7.1", features = ["request-id", "timeout", "limit", "trace", "catch-panic", "util"] }
uuid = { version = "=1.26.1", features = ["v4", "v7", "serde"] }
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["rust_crypto", "use_pem"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "form"] }
time = { version = "=0.3.55", features = ["serde", "formatting", "parsing"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }

[profile.release]
lto = "thin"
codegen-units = 4

# The browser build of the core (pnpm rust:wasm): smallest and fastest code, and a
# panic traps instead of unwinding (the app rebuilds the core then, docs/adr/0008).
[profile.wasm]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
