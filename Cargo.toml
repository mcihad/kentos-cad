# KentOS Rust workspace (CLAUDE.md §14). crates/shared: platform-neutral libraries
# (geometry core, contracts, file formats) that the web app (through crates/wasm), the
# server (crates/server, apps/api) and the future desktop app share.
[workspace]
resolver = "3"
members = [
    # Platform-neutral libraries: the web app, the server and the desktop app share them.
    "crates/shared/geometry-core",
    "crates/shared/contracts",
    "crates/shared/formats",
    # Netcad NCZ drawings (docs/adr/0138): a port of the NCZ Reader plugin, GPL-2.0-or-later
    # (crates/shared/ncz/README.md: not distributed before the author's permission).
    "crates/shared/ncz",
    # The project file, .kcad v2 (docs/specs/kcad-v2.md, docs/adr/0025).
    "crates/shared/kcad",
    # The expression language (docs/adr/0100): processing tools, styles and filters.
    "crates/shared/expression",
    # Sheet layouts, pafta düzeni (docs/sheet/design.md): one core for the web and the desktop.
    "crates/shared/sheet",
    "crates/shared/style-core",
    "crates/shared/svg-core",
    # Browser bindings (wasm-bindgen) of the shared libraries.
    "crates/wasm/geometry-wasm",
    "crates/wasm/formats-wasm",
    # DXF and Netcad NCZ in modules of their own, loaded only when such a file is imported.
    "crates/wasm/dxf-wasm",
    "crates/wasm/ncz-wasm",
    # The sheet core in a module of its own, loaded when the sheet mode opens.
    "crates/wasm/sheet-wasm",
    "crates/wasm/svg-wasm",
    # Native libraries (desktop, later the server; never the browser): the drawing
    # document, the counterpart of the web's TypeScript one (docs/adr/0020), the
    # product commands over it (docs/adr/0022), and the tool session, the counterpart
    # of the web's tools (docs/adr/0021).
    "crates/native/domain",
    "crates/native/application",
    "crates/native/interaction",
    # The desktop's processing tools (İşlemler, docs/PROCESSING.md): the web's tools and
    # models over the native document, held to fixtures/processing/v1.
    "crates/native/processing",
    # A drawing's project model (the coordinate system registry, a new project's content),
    # and the headless command host over the product commands (Python, AI; TODOS.md §14–15).
    "crates/native/project",
    "crates/native/headless",
    # The Python SDK's extension module kentos._native (docs/adr/0131): built by maturin, tested
    # from Python; not a default member, as it links a Python.
    "crates/native/python",
    # The MCP server over the headless host (docs/adr/0133): tools for AI agents over stdio.
    "crates/native/mcp",
    # The desktop's cloud client (docs/adr/0040): the web's protocol through a native adapter.
    "crates/native/cloud",
    # The desktop's style engine page (docs/adr/0090): the style library and a layer's way to the GPU.
    "crates/native/style",
    # Server-only libraries: PostgreSQL/PostGIS and the use cases.
    "crates/server/postgres",
    "crates/server/application",
    # Executables.
    "apps/api",
    # Desktop (docs/adr/0010, 0016): the KentOS UI library and its showcase. Not in
    # default-members, so web and server work never builds Iced and wgpu (TODOS.md UI-04);
    # pnpm rust:test:desktop and make test-desktop build them.
    "crates/ui",
    # Sheet layouts on the desktop (docs/sheet/design.md §11): the KentOS UI components over
    # the shared sheet core; desktop-only like the above.
    "crates/sheet-ui",
    "apps/ui-showcase",
    "apps/desktop",
    # The desktop's own wgpu drawing pipeline (docs/adr/0019); desktop-only like the above.
    "crates/render/wgpu",
]
default-members = [
    "crates/shared/geometry-core",
    "crates/shared/contracts",
    "crates/shared/formats",
    "crates/shared/ncz",
    "crates/shared/kcad",
    "crates/shared/expression",
    "crates/shared/sheet",
    "crates/shared/style-core",
    "crates/shared/svg-core",
    "crates/wasm/geometry-wasm",
    "crates/wasm/formats-wasm",
    "crates/wasm/dxf-wasm",
    "crates/wasm/ncz-wasm",
    "crates/wasm/sheet-wasm",
    "crates/wasm/svg-wasm",
    "crates/native/domain",
    "crates/native/application",
    "crates/native/interaction",
    "crates/native/processing",
    "crates/native/project",
    "crates/native/headless",
    "crates/native/mcp",
    "crates/native/cloud",
    "crates/native/style",
    "crates/server/postgres",
    "crates/server/application",
    "apps/api",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

# Exact versions: adding or bumping a dependency is a decision (CLAUDE.md §3).
[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
# float_roundtrip: parsed floats are exact (the default parser may be one ulp off), so
# coordinates cross the WASM boundary and files bit for bit (docs/adr/0008).
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
# Transcendental functions of the geometry core: the same code on every target, so native
# and WASM agree bit for bit (CLAUDE.md §23.4, docs/adr/0008).
libm = "=0.2.16"
# Zipped Shapefiles (docs/adr/0046 question 4, the owner's approval of 26 Sep; docs/adr/0053):
# inflate only, pure Rust, no unsafe of its own; already locked through the desktop's
# image decoders, so nothing new is downloaded.
miniz_oxide = { version = "=0.9.1", default-features = false, features = ["with-alloc"] }
rust_decimal = { version = "=1.43.0", default-features = false, features = ["std"] }
# Persistent object identity (docs/adr/0014): a v1 drawing's objects get ids derived from
# the sha256 of its canonical text through UUIDv5 (SHA-1). Both were locked already (axum
# and sqlx use them); the 0.10 line shares one `digest`. The `uuid` crate's `v5` feature
# would bring a package of its own (`sha1_smol`).
sha1 = { version = "=0.10.7", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }
ts-rs = { version = "=12.0.1", features = ["serde-json-impl"] }
# JSON Schema of the contract types, for the product command catalog (docs/adr/0013):
# the schemas are derived from the same serde types, so type and schema cannot drift.
schemars = { version = "=1.2.2", default-features = false, features = ["derive", "std"] }
wasm-bindgen = "=0.2.128"
axum = { version = "=0.8.9", features = ["ws"] }
# The response body of a streamed download (apps/api http/files.rs, docs/adr/0031): already in the
# binary through axum and hyper; named here only for its `Frame` type.
http-body = { version = "=1.1.0" }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
# Faz B (docs/adr/0006, 0007): PostgreSQL/PostGIS, HTTP middleware, identity.
# Database TLS is off for the local server; production enables a TLS feature (ADR 0006).
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "macros", "migrate", "uuid", "json", "time"] }
tower = { version = "=0.5.3", features = ["util"] }
tower-http = { version = "=0.7.1", features = ["request-id", "timeout", "limit", "trace", "catch-panic", "util"] }
uuid = { version = "=1.26.1", features = ["v4", "v7", "serde"] }
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["rust_crypto", "use_pem"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "form"] }
# The desktop's cloud client (docs/adr/0040): a file's bytes as a request body that every retry of
# an upload shares without a copy. Already in every binary that has reqwest (hyper's buffer type).
bytes = { version = "=1.12.1" }
time = { version = "=0.3.55", features = ["serde", "formatting", "parsing"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
# Desktop interface (docs/adr/0016): Iced and its companions at the versions kentos-rc
# was built and tested with (its lockfile, dc2e8df).
iced = { version = "=0.14.0" }
iced_runtime = { version = "=0.14.0" }
glam = { version = "=0.30.10" }
bytemuck = { version = "=1.25.2" }
png = { version = "=0.18.1" }
# Native open and save dialogs of the desktop app (owner's approval, 2026-09-25;
# docs/adr/0017): xdg-desktop-portal on Linux, the system dialog elsewhere.
rfd = { version = "=0.17.2" }
# The desktop's CAD drawing pipeline (docs/adr/0019): the wgpu Iced is built on, used
# directly so the renderer shares Iced's device (TODOS.md REN-01, REN-02). Same version
# and features as through Iced: nothing new in the lockfile.
wgpu = { version = "=27.0.1" }
# The styled drawing's atlas on the desktop (docs/adr/0090; the owner's approval, 2026-09-27):
# SVG pictograms, text markers and pattern tiles rasterized on the CPU. The version and
# features Iced's software renderer already builds (iced_tiny_skia): nothing new in the lockfile.
tiny-skia = { version = "=0.11.4", default-features = false, features = ["std", "simd"] }
# The Python SDK's extension module kentos._native (docs/adr/0131; the owner's approval,
# 2026-09-28): CPython 3.10 and later through the stable ABI, one wheel per platform. maturin
# (1.9.4 and later) builds it and sets PYO3_BUILD_EXTENSION_MODULE, so the deprecated
# `extension-module` feature is not used; a plain cargo build links the system's libpython.
pyo3 = { version = "=0.29.2", default-features = false, features = ["macros", "abi3-py310"] }
# SVG text read into the SVG core's element tree on the desktop (docs/adr/0090; the owner's
# approval, 2026-09-27); the web lets the browser parse it. Locked already through fontdb.
roxmltree = { version = "=0.20.0" }
# SVG pictures of a sheet on the desktop (docs/sheet/design.md, open question 6; the owner's
# approval, 2026-10-03): their size read when one is added (usvg through resvg). The version
# Iced's SVG support draws them with; its default features come with Iced anyway.
resvg = { version = "=0.45.1", default-features = false }
# JPEG images of the style library on the desktop (docs/adr/0092; the owner's approval,
# 2026-09-27); the web lets the browser decode them. Pure Rust, the image crate's JPEG decoder;
# without its SIMD paths (`x86`, `neon`): a picture is decoded once and kept.
zune-jpeg = { version = "=0.5.15", default-features = false, features = ["std"] }
# Tests only: the naga wgpu uses validates the shared WGSL (shaders/wgsl, REN-05).
naga = { version = "=27.0.3", features = ["wgsl-in"] }
# Tests only: waits on wgpu's futures in the renderer's GPU test (locked through rfd).
pollster = { version = "=0.4.0" }
# The sheet layouts' PDF and GeoPDF writer (docs/sheet/design.md §9a; the owner's approval,
# 2026-10-03): pure Rust, the same bytes in the browser and on the desktop. It writes the objects
# only; compression is miniz_oxide's.
pdf-writer = { version = "=0.15.0" }
# The sheet PDF's fonts embedded as subsets (design §9a; the owner's approval, 2026-10-03).
# Without its default `variable-fonts` feature, which would bring skrifa 0.42, write-fonts and
# kurbo: the drawing's faces are static TrueType.
subsetter = { version = "=0.2.6", default-features = false }
# The drawing's TrueType faces read for the sheet PDF: glyphs of the characters, advances, names
# (design §9a names it). Locked already through fontdb and cosmic-text: nothing new is downloaded.
ttf-parser = { version = "=0.25.1", default-features = false, features = ["std"] }

# Debug builds and tests keep line tables only, so a panic's backtrace still names
# the file and line, and dependencies none: with full DWARF the desktop's test binary
# was near 1 GB and the debug folder 125 GB, and linking and writing them was most
# of a rebuild (the owner, 4 October 2026: test and build times too long).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 4

# The browser build of the core (pnpm rust:wasm): smallest and fastest code, and a
# panic traps instead of unwinding (the app rebuilds the core then, docs/adr/0008).
[profile.wasm]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"

# The same for the dev server, tests and e2e (scripts/wasm/ensure.mjs; `pnpm build` and
# the perf scripts take `wasm`): no whole-program LTO and parallel code generation, so
# a core edit rebuilds the six packages in a fraction of the time. The code is the same
# Rust with the same float semantics; only inlining across crates differs.
[profile.wasm-dev]
inherits = "wasm"
lto = false
codegen-units = 16
