# KentOS Rust workspace (CLAUDE.md §14). crates/shared: platform-neutral libraries
# (geometry core, contracts, file formats) that the desktop programs, the server
# (crates/server, apps/api) and the automation hosts share.
[workspace]
resolver = "3"
members = [
    # Platform-neutral libraries: the desktop programs, the server and the automation hosts share them.
    # The numeric base under them all (docs/adr/9403): correctly rounded functions, no dependency.
    "crates/shared/num",
    "crates/shared/geometry-core",
    "crates/shared/contracts",
    "crates/shared/commands",
    "crates/shared/formats",
    "crates/shared/zip",
    # Extension packages, .kek (docs/adr/8057, plan/eklenti.md): the manifest, the inspector, the packer; and the
    # registry of the packages a user installed.
    "crates/shared/extensions",
    "crates/native/extension-host",
    "crates/native/python-env",
    # The standards packages' Python rules asked from Rust (docs/adr/8075 §2.6).
    "crates/native/standards",
    # An extension's İşlemler tools run in its own Python process: the desktop and the headless hosts share it
    # (docs/adr/8057 §70).
    "crates/native/extension-tools",
    "crates/shared/qml",
    "crates/shared/maplibre",
    # DWG codec adapter (ADR 0586): OpenCADStudio's pinned, MPL-2.0 codec;
    # its types never cross this crate's public boundary.
    "crates/native/dwg",
    # Point clouds (docs/adr/0207): LAS, LAZ, COPC and text clouds, their index, looks and
    # operations; a crate of its own so the formats worker does not carry LAZ.
    "crates/shared/pointcloud",
    # NCZ drawings (docs/adr/0138): a port of an NCZ reader, GPL-2.0-or-later
    # (crates/shared/ncz/README.md: not distributed before the author's permission).
    "crates/shared/ncz",
    # The project file, .kcad v2 (docs/specs/kcad-v2.md, docs/adr/0025).
    "crates/shared/kcad",
    # Map services (docs/adr/0208): requests, capabilities, vector tiles and their styles.
    "crates/shared/services",
    # Raster analysis (docs/adr/0231–0236): surface analysis, contours and the rest of the raster
    # tools, one core for the web's analysis worker and the desktop's processing thread.
    "crates/shared/raster",
    # The expression language (docs/adr/0100): processing tools, styles and filters.
    "crates/shared/expression",
    # KentOS Yol's engineering core (plan/road.md, docs/adr/0900): the terrain surface, later the alignments,
    # profiles, sections and earthworks; KentOS Harita's zoning plans may use it too.
    "crates/shared/road",
    # The 3D scene core (plan/3d.md D1, docs/adr/0910 §3): camera, tiles, LOD selection, chunking; no GPU.
    "crates/shared/scene3d",
    "crates/shared/model-view",
    # The forms core (docs/adr/0401): a form's preflight, rules and a record's validation.
    "crates/shared/forms",
    # The 2026 digital project regulation as data (docs/adr/8062): its annexes' rules with their pages, the profile's
    # layers and KentOS's decisions; kentos-ifc keeps the IFC annexes over it.
    "crates/shared/digital-project",
    # IFC (docs/adr/8047, 0908 §8): writing the road's alignments and the building as IFC 4.3, the digital project
    # regulation's classes, names and properties; later reading IFC and checking a model. A crate of its own: the IFC
    # work grows here.
    "crates/shared/ifc",
    # Sheet layouts, pafta düzeni (docs/sheet/design.md).
    "crates/shared/sheet",
    "crates/shared/style-core",
    "crates/shared/svg-core",
    # Native libraries (desktop, later the server): the drawing document
    # (docs/adr/0020), the product commands over it (docs/adr/0022), and the tool
    # session (docs/adr/0021).
    "crates/native/domain",
    "crates/native/application",
    "crates/native/interaction",
    "crates/native/scene-query",
    # The desktop's processing tools (İşlemler, docs/PROCESSING.md): the web's tools and
    # models over the native document, held to fixtures/processing/v1.
    "crates/native/processing",
    # A drawing's project model (the coordinate system registry, a new project's content),
    # and the headless command host over the product commands (Python, AI; TODOS.md §14–15).
    "crates/native/project",
    "crates/native/geopackage",
    "crates/native/postgis",
    "crates/native/data",
    "crates/native/data-gpkg",
    "crates/native/data-postgis",
    "crates/native/headless",
    # The Python SDK's extension module kentos._native (docs/adr/0131): built by maturin, tested
    # from Python; not a default member, as it links a Python.
    "crates/native/python",
    # The MCP server over the headless host (docs/adr/0133): tools for AI agents over stdio.
    "crates/native/mcp",
    # The desktop's cloud client (docs/adr/0040): the web's protocol through a native adapter.
    "crates/native/cloud",
    "crates/native/agent",
    # The desktop's style engine page (docs/adr/0090): the style library and a layer's way to the GPU.
    "crates/native/style",
    # The style library and its .kstil file (docs/adr/0314 §3), under the product commands and the style page.
    "crates/native/style-library",
    "crates/native/plot",
    # What KentOS Launcher and the programs it starts share (docs/adr/0800, 0801).
    "crates/native/launch",
    # Server-only libraries: PostgreSQL/PostGIS and the use cases.
    "crates/server/postgres",
    "crates/server/application",
    # Executables.
    "apps/api",
    # The process that runs an İşlemler tool for a server job (docs/adr/0559 §3).
    "apps/jobrun",
    # kentos, the command line for authors and agents: `kentos kek inspect|pack` (plan/eklenti.md ADIM 16).
    "apps/cli",
    # KentOS İmza, the e-signature (docs/adr/9002): error taxonomy, the model and its wire types, signed requests,
    # the providers and the signing engine, the audit chain, PKCS#11 and the local bridge the web portal calls.
    "crates/imza/core",
    "crates/imza/domain",
    "crates/imza/security",
    "crates/imza/signature",
    "crates/imza/audit",
    "crates/imza/pkcs11",
    "crates/imza/api",
    "apps/imza-service",
    # Desktop (docs/adr/0010, 0016): the KentOS UI library and its showcase. Not in
    # default-members, so web and server work never builds Iced and wgpu (TODOS.md UI-04);
    # pnpm rust:test:desktop and make test-desktop build them.
    "crates/ui",
    # Sheet layouts on the desktop (docs/sheet/design.md §11): the KentOS UI components over
    # the shared sheet core; desktop-only like the above.
    "crates/sheet-ui",
    "crates/model-view-ui",
    "apps/ui-showcase",
    "apps/desktop",
    "apps/desktop-arch",
    "apps/desktop-cbs",
    "apps/desktop-map",
    "apps/desktop-road",
    "apps/kentos-cad",
    # KentOS Launcher (docs/adr/0800): KentOS's programs and others from their manifests, in one window.
    "apps/launcher",
    # The desktop's own wgpu drawing pipeline (docs/adr/0019); desktop-only like the above.
    "crates/render/scene3d",
    "crates/render/wgpu",
    # KentOS İmza's signing dialog and its PIN window (docs/adr/9002): Iced, so desktop-only like the above.
    "crates/imza/ui",
    "apps/imza-agent",
]
default-members = [
    "crates/shared/num",
    "crates/shared/geometry-core",
    "crates/shared/contracts",
    "crates/shared/commands",
    "crates/shared/formats",
    "crates/shared/zip",
    "crates/shared/extensions",
    "crates/native/extension-host",
    "crates/native/python-env",
    "crates/native/standards",
    "crates/native/extension-tools",
    "crates/shared/qml",
    "crates/shared/maplibre",
    "crates/native/dwg",
    "crates/shared/pointcloud",
    "crates/shared/ncz",
    "crates/shared/kcad",
    "crates/shared/services",
    "crates/shared/raster",
    "crates/shared/expression",
    "crates/shared/road",
    "crates/shared/scene3d",
    "crates/shared/model-view",
    "crates/shared/forms",
    "crates/shared/digital-project",
    "crates/shared/sheet",
    "crates/shared/style-core",
    "crates/shared/svg-core",
    "crates/native/domain",
    "crates/native/application",
    "crates/native/interaction",
    "crates/native/scene-query",
    "crates/native/processing",
    "crates/native/project",
    "crates/native/geopackage",
    "crates/native/postgis",
    "crates/native/data",
    "crates/native/data-gpkg",
    "crates/native/data-postgis",
    "crates/native/headless",
    "crates/native/mcp",
    "crates/native/cloud",
    "crates/native/style",
    "crates/native/style-library",
    "crates/native/launch",
    "crates/server/postgres",
    "crates/server/application",
    "apps/api",
    "apps/jobrun",
    "apps/cli",
    "crates/imza/core",
    "crates/imza/domain",
    "crates/imza/security",
    "crates/imza/signature",
    "crates/imza/audit",
    "crates/imza/pkcs11",
    "crates/imza/api",
    "apps/imza-service",
]
# GeographicLib's Rust port with libm's functions (docs/adr/0171): the release's own code, a path
# dependency of the geometry core but not a member (its tests run by hand, its lints its authors').
exclude = ["crates/shared/geographiclib-rs", "crates/vendor/block"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

# Exact versions: adding or bumping a dependency is a decision (CLAUDE.md §3).
[workspace.dependencies]
# The DWG codec (docs/adr/8053). Owner's decision, 24 November 2026: always the latest main of the owner's own
# repository, never pinned to a revision; `make desktop`, `desktop-release` and `build-desktop` run
# `cargo update -p acadrust` first, and Cargo.lock records what that build took.
acadrust = { git = "https://github.com/mcihad/acadrust.git", branch = "main", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
# float_roundtrip: parsed floats are exact (the default parser may be one ulp off), so
# coordinates cross files and the wire bit for bit (docs/adr/0008).
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
# Transcendental functions of the geometry core: the same code on every target, so every
# platform gives the same bits (CLAUDE.md §23.4, docs/adr/0008). What takes its place is
# decided in docs/adr/9402 §7 (BK-88).
libm = "=0.2.16"
# Correctly rounded elementary functions for the numeric base (docs/adr/9403 §3; the owner's approval, 28 November
# 2026): pure Rust, no dependency of its own, already locked through the desktop's image decoders. Only kentos-num
# names it: every function taken from it is held bit for bit to an independent reference there, and a new version is
# taken only when that test passes.
pxfm = "=0.1.30"
# Regular expressions of the expression language (docs/adr/0214 §2.4, the owner's approval of
# 10 Oct): rust-lang's small engine, no dependencies of its own, Unicode tables left out.
regex-lite = { version = "=0.1.9", default-features = false, features = ["std", "string"] }
# Zipped Shapefiles (docs/adr/0046 question 4, the owner's approval of 26 Sep; docs/adr/0053):
# inflate only, pure Rust, no unsafe of its own; already locked through the desktop's
# image decoders, so nothing new is downloaded.
miniz_oxide = { version = "=0.9.1", default-features = false, features = ["with-alloc"] }
rust_decimal = { version = "=1.43.0", default-features = false, features = ["std"] }
# LAZ (LASzip) point records of point clouds (docs/adr/0207; the owner's approval, 2026-10-08):
# laz-rs, the Rust port of LASzip, pure Rust; only its chunk compressors and decompressors are
# used, LAS and COPC are read and written by KentOS.
# Without `parallel` (rayon): the hosts decompress chunks on their own threads.
laz = { version = "=0.14.0", default-features = false }
# Geodesics and areas on the ellipsoid (Karney 2013): the measurements' ellipsoid and ground values
# (docs/adr/0171, the owner's approval of 4 October). The crates.io release with libm's functions
# on every target (crates/shared/geographiclib-rs, written by scripts/vendor/geographiclib.py):
# the release calls Rust's own float methods, and the desktop and the web parted far beyond the
# last bits. Not a workspace member (excluded below).
geographiclib-rs = { path = "crates/shared/geographiclib-rs", version = "=0.2.7" }
# Persistent object identity (docs/adr/0014): a v1 drawing's objects get ids derived from
# the sha256 of its canonical text through UUIDv5 (SHA-1). Both were locked already (axum
# and sqlx use them); the 0.10 line shares one `digest`. The `uuid` crate's `v5` feature
# would bring a package of its own (`sha1_smol`).
sha1 = { version = "=0.11.0", default-features = false }
sha2 = { version = "=0.11.1", default-features = false }
# `no-serde-warnings`: ts-rs reads the serde attributes it knows and warned at every build about the rest
# (`deny_unknown_fields`, which has no TypeScript form, and the custom `serialize_with`/`deserialize_with` fields, whose
# TypeScript type each states with `#[ts(as = ...)]`); the generated types do not change.
ts-rs = { version = "=12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }
# JSON Schema of the contract types, for the product command catalog (docs/adr/0013):
# the schemas are derived from the same serde types, so type and schema cannot drift.
schemars = { version = "=1.2.3", default-features = false, features = ["derive", "std"] }
axum = { version = "=0.8.9", features = ["ws"] }
# The response body of a streamed download (apps/api http/files.rs, docs/adr/0031): already in the
# binary through axum and hyper; named here only for its `Frame` type.
http-body = { version = "=1.1.0" }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
# Faz B (docs/adr/0006, 0007): PostgreSQL/PostGIS, HTTP middleware, identity.
# Database TLS is off for the local server; production enables a TLS feature (ADR 0006).
sqlx = { version = "=0.9.1", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "macros", "migrate", "uuid", "json", "time"] }
tower = { version = "=0.5.3", features = ["util"] }
tower-http = { version = "=0.7.1", features = ["request-id", "timeout", "limit", "trace", "catch-panic", "util"] }
uuid = { version = "=1.29.3", features = ["v4", "v7", "serde"] }
# The server job's process group and its end (docs/adr/8057 §58): kill(2) of the group and waitid(2) without reaping;
# std has neither. Unix only. The cloud audit box's filter (§63) takes its call numbers from it, constants only.
libc = "=0.2.191"
# The cloud audit box (docs/adr/8057 §61): Landlock's safe interface (rulesets, restrict_self); only the job runner,
# only Linux.
landlock = "=0.4.7"
# The cloud audit box's seccomp filter (docs/adr/8057 §63): compiled and installed through a safe interface, pure Rust
# over libc, no system library; only the job runner, only Linux on x86_64 and aarch64.
seccompiler = "=0.5.0"
# GeoPackage is SQLite (docs/adr/0502): SQLite compiled in, no system library; only crates/native/geopackage.
rusqlite = { version = "=0.43.0", features = ["bundled", "functions"] }
jsonwebtoken = { version = "=12.0.0", default-features = false, features = ["rust_crypto", "use_pem"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "form"] }
# The desktop's cloud client (docs/adr/0040): a file's bytes as a request body that every retry of
# an upload shares without a copy. Already in every binary that has reqwest (hyper's buffer type).
bytes = { version = "=1.12.2" }
time = { version = "=0.3.55", features = ["serde", "formatting", "parsing"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
# Desktop interface (docs/adr/0016): Iced and its companions at the versions kentos-rc
# was built and tested with (its lockfile, dc2e8df).
iced = { version = "=0.14.0" }
iced_runtime = { version = "=0.14.0" }
glam = { version = "=0.34.3" }
bytemuck = { version = "=1.25.2" }
png = { version = "=0.18.1" }
# Native open and save dialogs of the desktop app (owner's approval, 2026-09-25;
# docs/adr/0017): xdg-desktop-portal on Linux, the system dialog elsewhere.
rfd = { version = "=0.18.0" }
# The desktop's CAD drawing pipeline (docs/adr/0019): the wgpu Iced is built on, used
# directly so the renderer shares Iced's device (TODOS.md REN-01, REN-02). Same version
# and features as through Iced: nothing new in the lockfile.
wgpu = { version = "=27.0.1" }
# The styled drawing's atlas on the desktop (docs/adr/0090; the owner's approval, 2026-09-27):
# SVG pictograms, text markers and pattern tiles rasterized on the CPU. The version and
# features Iced's software renderer already builds (iced_tiny_skia): nothing new in the lockfile.
tiny-skia = { version = "=0.11.4", default-features = false, features = ["std", "simd"] }
# The Python SDK's extension module kentos._native (docs/adr/0131; the owner's approval,
# 2026-09-28): CPython 3.10 and later through the stable ABI, one wheel per platform. maturin
# (1.9.4 and later) builds it and sets PYO3_BUILD_EXTENSION_MODULE, so the deprecated
# `extension-module` feature is not used; a plain cargo build links the system's libpython.
pyo3 = { version = "=0.30.1", default-features = false, features = ["macros", "abi3-py310"] }
# SVG text read into the SVG core's element tree on the desktop (docs/adr/0090; the owner's
# approval, 2026-09-27). Locked already through fontdb.
roxmltree = { version = "=0.21.2" }
# SVG pictures of a sheet on the desktop (docs/sheet/design.md, open question 6; the owner's
# approval, 2026-10-03): their size read when one is added (usvg through resvg). The version
# Iced's SVG support draws them with; its default features come with Iced anyway.
resvg = { version = "=0.45.1", default-features = false }
# JPEG images of the style library on the desktop (docs/adr/0092; the owner's approval,
# 2026-09-27). Pure Rust, the image crate's JPEG decoder;
# without its SIMD paths (`x86`, `neon`): a picture is decoded once and kept.
zune-jpeg = { version = "=0.5.15", default-features = false, features = ["std"] }
# WebP tiles of a GeoPackage read and written in the formats core (docs/adr/0627 §1; the owner's
# approval for CBS-03, October 2026): pure Rust, image-rs's own WebP codec, already in the lock
# through resvg; lossy and lossless decoding, lossless encoding.
image-webp = { version = "=0.2.4", default-features = false }
# KentOS İmza, the e-signature (docs/adr/9002; the owner's approval of 18 November 2026, docs/deps/README.md).
# Versions the lockfile already held where the API differs little: RustCrypto's 0.13 curves (the platform's code was
# written for 0.14), ed25519-dalek 2 and base64 0.22.
thiserror = "=2.0.21"
hex = "=0.4.3"
base64 = "=0.23.1"
ed25519-dalek = "=3.0.0"
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
p384 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
rsa = { version = "=0.10.0", default-features = false, features = ["std", "encoding", "pkcs1v15"] }
# New to the lockfile: X.509 parsing (qualified certificate, the signer's key on the server) and PKCS#11.
x509-parser = "=0.18.1"
cryptoki = "=0.12.1"
# The server's envelope key, generated (feature `issue` of kentos-imza-security only).
getrandom = "=0.4.3"
# The PIN window's link to the local bridge's event stream.
tokio-tungstenite = "=0.30.0"
futures-util = "=0.3.34"
# Tests only: the naga wgpu uses validates the shared WGSL (shaders/wgsl, REN-05).
naga = { version = "=27.0.3", features = ["wgsl-in"] }
# Tests only: waits on wgpu's futures in the renderer's GPU test (locked through rfd).
pollster = { version = "=1.0.3" }
# The sheet layouts' PDF and GeoPDF writer (docs/sheet/design.md §9a; the owner's approval,
# 2026-10-03): pure Rust. It writes the objects
# only; compression is miniz_oxide's.
pdf-writer = { version = "=0.15.0" }
# The sheet PDF's fonts embedded as subsets (design §9a; the owner's approval, 2026-10-03).
# Without its default `variable-fonts` feature, which would bring skrifa 0.42, write-fonts and
# kurbo: the drawing's faces are static TrueType.
subsetter = { version = "=0.2.6", default-features = false }
# The drawing's TrueType faces read for the sheet PDF: glyphs of the characters, advances, names
# (design §9a names it). Locked already through fontdb and cosmic-text: nothing new is downloaded.
ttf-parser = { version = "=0.25.1", default-features = false, features = ["std"] }

# Debug builds and tests keep line tables only, so a panic's backtrace still names
# the file and line, and dependencies none: with full DWARF the desktop's test binary
# was near 1 GB and the debug folder 125 GB, and linking and writing them was most
# of a rebuild (the owner, 4 October 2026: test and build times too long).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 4

# The desktop's and the launcher's programs ship without their symbol tables (docs/adr/0802 §1: 39 of kentos-cad's
# 255 MB). The setting is the package that links the program: kentos-cad's since the programs left the core
# (docs/adr/9199 §4.2, §4.16; on the core's library it reached no program). For a profile with names (perf, a
# symbolised backtrace, PGO): cargo build --release --config 'profile.release.package.kentos-cad.strip="none"' (a
# config profile comes before the manifest's; the environment variable for a package's setting does not override it,
# docs/adr/8055 §3).
[profile.release.package.kentos-cad]
strip = "symbols"

[profile.release.package.kentos-launcher]
strip = "symbols"

# Apple's blocks (wgpu-hal 27's Metal backend, through `metal`, under iced 0.14): the crates.io release of block 0.1.6
# with its extern static declared of an inhabited opaque type (crates/vendor/block, written by scripts/vendor/block.py;
# the owner's approval, 2026-11-07). The release's static of an uninhabited type is a future error (rust-lang/rust#74840)
# that cargo reported at every build. Take the patch out when iced and wgpu move to objc2's blocks.
[patch.crates-io]
block = { path = "crates/vendor/block" }
