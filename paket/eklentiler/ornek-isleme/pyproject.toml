# Örnek Python işlem aracının Python tarafı (paket/eklentiler/ornek-isleme). Kütüphane istemez; `uv lock` uv.lock'u
# buradan yazar.
[project]
name = "ornek-isleme"
version = "1.0.0"
description = "KentOS'un örnek Python işlem aracı: Alan dilimleri"
requires-python = ">=3.12,<3.15"
dependencies = []

[tool.uv]
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
