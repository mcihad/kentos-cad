[package]
name = "kentos-jobrun"
description = "The process that runs one İşlemler tool for a server job (docs/adr/0559 §3): the headless host over one project file"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "kentos-jobrun"
path = "src/main.rs"

[dependencies]
kentos-contracts = { path = "../../crates/shared/contracts", default-features = false }
# The tool runs through the headless host as `cad.processing.run` does for Python and MCP.
kentos-headless = { path = "../../crates/native/headless" }
kentos-processing = { path = "../../crates/native/processing" }
serde_json = { workspace = true }
