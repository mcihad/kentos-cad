[package]
name = "kentos-api"
description = "KentOS server (kentosd): HTTP API, database setup and administration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "kentosd"
path = "src/main.rs"

[dependencies]
kentos-contracts = { path = "../../crates/shared/contracts", default-features = false }
kentos-application = { path = "../../crates/server/application" }
kentos-postgres = { path = "../../crates/server/postgres" }
# The sheet template library's types (docs/sheet/design.md §13).
kentos-sheet = { path = "../../crates/shared/sheet", default-features = false }
# The extension catalog's release flow and the package inspector (docs/adr/8059): the server moves releases only through
# them, the same code the desktop and the agents use.
kentos-extensions = { path = "../../crates/shared/extensions" }
# An audit release's Python environment (docs/adr/8057 §66): made by the desktop's own machinery (keyed, made from the
# lock, checked, marked ready last), wheels only; uv is run as a program, nothing of Python is embedded.
kentos-python-env = { path = "../../crates/native/python-env" }
axum = { workspace = true }
http-body = { workspace = true }
tokio = { workspace = true, features = ["process"] }
serde = { workspace = true }
serde_json = { workspace = true }
futures-util = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
jsonwebtoken = { workspace = true }
reqwest = { workspace = true }
time = { workspace = true }
# The webhook's HMAC-SHA256 signature of a notification (docs/adr/9000 §17).
sha2 = { workspace = true }

# The job's process group ended at its budget, the rule's Python with it (docs/adr/8057 §58).
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util"] }
# A wheel written in the catalog's SBOM test, its licence read back (docs/adr/8057 §99).
kentos-zip = { path = "../../crates/shared/zip" }
# The SHA-256 of an uploaded file in the file routes' tests (docs/adr/0031).
sha2 = { workspace = true }
# Reading back a project's snapshot in the file routes' tests (docs/adr/0033).
kentos-kcad = { path = "../../crates/shared/kcad" }
# The desktop's cloud client against this server over a real socket (docs/adr/0040), and
# the drawing document it opens projects into.
kentos-cloud = { path = "../../crates/native/cloud" }
kentos-domain = { path = "../../crates/native/domain" }
# The desktop's coordinate engine and registry, which the server's job must agree with to the bit (docs/adr/0631 §6).
kentos-geometry-core = { path = "../../crates/shared/geometry-core" }
kentos-project = { path = "../../crates/native/project" }
# The API's description (docs/api/openapi.json): the contracts' JSON Schemas, generated and checked in a test.
schemars = { workspace = true }
kentos-contracts = { path = "../../crates/shared/contracts", default-features = false, features = ["schema"] }
