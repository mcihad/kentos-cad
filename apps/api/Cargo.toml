[package]
name = "kentos-api"
description = "KentOS server (kentosd): HTTP API, database setup and administration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "kentosd"
path = "src/main.rs"

[dependencies]
kentos-contracts = { path = "../../crates/shared/contracts", default-features = false }
kentos-application = { path = "../../crates/server/application" }
kentos-postgres = { path = "../../crates/server/postgres" }
axum = { workspace = true }
http-body = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
jsonwebtoken = { workspace = true }
reqwest = { workspace = true }
time = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util"] }
# The SHA-256 of an uploaded file in the file routes' tests (docs/adr/0031).
sha2 = { workspace = true }
# Reading back a project's snapshot in the file routes' tests (docs/adr/0033).
kentos-kcad = { path = "../../crates/shared/kcad" }
# The desktop's cloud client against this server over a real socket (docs/adr/0040), and
# the drawing document it opens projects into.
kentos-cloud = { path = "../../crates/native/cloud" }
kentos-domain = { path = "../../crates/native/domain" }
