[package]
name = "kentos-cli"
description = "kentos: KentOS's command line for authors and agents: the extension package's `kentos kek` commands, from inspecting and packing to a headless test (plan/eklenti.md ADIM 16, 21)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "kentos"
path = "src/main.rs"

# Native only (scripts/arch/deps.mjs, group `cli`): the extension crate's inspector and packer over the file system and
# the user's extension registry; no argument-parsing dependency for a few subcommands.
[dependencies]
kentos-extensions = { path = "../../crates/shared/extensions" }
# `kentos kek dump`: the user's registry, read without activating anything.
kentos-extension-host = { path = "../../crates/native/extension-host" }
# `kentos kek test` (docs/adr/8057 §74): the extension installed in a registry of its own, its environment prepared
# from its lock, its tools' examples run on synthetic drawings in its own process as the desktop runs them; and
# `kek verify` reads the İşlemler tools' descriptors whole, as KentOS's processing does. The headless host is CBS's
# alone, the discipline extensions' tools belong to.
kentos-extension-tools = { path = "../../crates/native/extension-tools" }
kentos-headless = { path = "../../crates/native/headless", default-features = false, features = ["mod-gis"] }
kentos-processing = { path = "../../crates/native/processing" }
kentos-python-env = { path = "../../crates/native/python-env" }
serde_json = { workspace = true }
