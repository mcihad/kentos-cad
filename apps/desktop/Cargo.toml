[package]
name = "kentos-desktop"
description = "KentOS CAD masaüstü uygulaması: native Iced + KentOS UI (docs/adr/0010, 0017)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# `cargo run -p kentos-desktop` is kentos-cad; the module programs are built beside it.
default-run = "kentos-cad"

# The desktop is a library and its programs (docs/adr/0801): `kentos-cad`, every module at once (`--modul <id>` one of
# them), and each module's own program. The unit tests live in the library; no program has tests of its own, so a
# test run links one binary. Doc comments are not tests.
[lib]
name = "kentos_desktop"
path = "src/lib.rs"
doctest = false

# The one program file (docs/adr/0802 §1): every module at once as `kentos-cad`, and KentOS Mimari, KentOS Harita and
# KentOS GIS under their own names (`kentos-mimari` …, links made by scripts/desktop/module_links.py) or with
# `--modul`. Four copies of the same code were 4 × 255 MB.
[[bin]]
name = "kentos-cad"
path = "src/main.rs"
test = false

[dependencies]
kentos-postgis = { path = "../../crates/native/postgis" }
# The KentOS modules, the command line that starts one and the recent files, shared with KentOS Launcher (docs/adr/0800, 0801).
kentos-launch = { path = "../../crates/native/launch" }
kentos-ui = { path = "../../crates/ui", default-features = false, features = ["fonts", "snapshot"] }
kentos-commands = { path = "../../crates/shared/commands", default-features = false }
# The project file, .kcad v2 (docs/specs/kcad-v2.md, docs/adr/0025): the shared codec the web runs in WASM.
kentos-kcad = { path = "../../crates/shared/kcad" }
# The drawing document: the web's CadDocument semantics, natively (docs/adr/0020).
kentos-domain = { path = "../../crates/native/domain" }
# The drawing area's wgpu pipeline (docs/adr/0019), fed through Iced's shader widget.
kentos-render-wgpu = { path = "../../crates/render/wgpu" }
# Sheet layouts (docs/sheet/design.md §11): the mode, and the core's types it is given (sheets.rs).
kentos-sheet-ui = { path = "../../crates/sheet-ui" }
kentos-sheet = { path = "../../crates/shared/sheet", default-features = false }
# The tool session: tools, prompts and typed input over the document (docs/adr/0021).
kentos-interaction = { path = "../../crates/native/interaction" }
# Nokta editörü writes through the product commands themselves: it tells a refusal by its path (points/edit.rs, docs/adr/0153).
kentos-native-application = { path = "../../crates/native/application" }
# İşlemler (docs/PROCESSING.md): the processing tools and models over the document, held to
# the web's by fixtures/processing/v1 (docs/adr/0084).
kentos-processing = { path = "../../crates/native/processing" }
# The coordinate system registry and a new project's content, shared with the headless host.
kentos-project = { path = "../../crates/native/project" }
# The Python console's requests on the open drawing (docs/adr/0132): the headless host's `rpc`.
kentos-headless = { path = "../../crates/native/headless" }
kentos-geopackage = { path = "../../crates/native/geopackage" }
# The cloud client (docs/adr/0040): signing in, the catalog, opening, saving and following
# cloud projects, device drafts; its own runtime, awaited on Iced's executor (docs/adr/0041).
kentos-cloud = { path = "../../crates/native/cloud" }
# File exchange (exchange/): the shared readers and writers of coordinate lists and DXF,
# the ones the web runs in its formats worker (CLAUDE.md §9.7, docs/adr/0009).
kentos-formats = { path = "../../crates/shared/formats" }
kentos-dwg = { path = "../../crates/native/dwg" }
# A drawing on paper (docs/adr/0252): the sheet PDF's maps, inputs and faces, shared with the headless host.
kentos-plot = { path = "../../crates/native/plot" }
# Point clouds (docs/adr/0207): LAS, LAZ, COPC and text clouds, their index, looks and operations.
kentos-pointcloud = { path = "../../crates/shared/pointcloud" }
# Map services (docs/adr/0208): requests, capabilities, vector tiles and their styles, labels,
# features and the HTTP cache rules, shared with the web's WASM.
kentos-services = { path = "../../crates/shared/services" }
# Netcad NCZ in (docs/adr/0138): a port of GPL-2.0-or-later code, not distributed before the
# author's permission (crates/shared/ncz/README.md).
kentos-ncz = { path = "../../crates/shared/ncz" }
# The style engine (style/, docs/adr/0090): the library, each layer's program and
# batches; the store they are built next to; SVG drawings read for the atlas with
# the SVG core's readers, parsed by roxmltree (the owner's approval, 2026-09-27;
# locked already through fontdb); PNG images decoded with the workspace's png, JPEG
# images with zune-jpeg (the owner's approval, 2026-09-27; docs/adr/0092).
kentos-native-style = { path = "../../crates/native/style" }
kentos-geometry-core = { path = "../../crates/shared/geometry-core" }
# The expression language's editor services (İfade oluşturucu, docs/adr/0100 §5).
kentos-expression = { path = "../../crates/shared/expression" }
# The forms core (docs/adr/0401): Formlar's preflight and Formla düzenle's rules.
kentos-forms = { path = "../../crates/shared/forms" }
kentos-svg-core = { path = "../../crates/shared/svg-core" }
roxmltree = { workspace = true }
png = { workspace = true }
zune-jpeg = { workspace = true }
# SVG for the new project wizard's pictures (docs/adr/0165 §3): Iced's SVG support,
# already built for the sheet designer (crates/sheet-ui); nothing new in the lockfile.
iced = { workspace = true, features = ["canvas", "svg", "image-without-codecs"] }
# Grafikler (charts/, docs/adr/0227 §5, §7): a chart's shapes painted in the screen's pixels
# with tiny-skia and shown as a canvas image (Iced's image support without codecs, built
# already for the sheet designer); its PNG drawn by resvg from the core's SVG, with text in
# KentOS's own faces. Nothing new in the lockfile.
tiny-skia = { workspace = true }
resvg = { workspace = true, features = ["text"] }
# The trace player (traces.rs) runs the app's own tasks (save, open) without a
# window: Iced's runtime crate, already in the binary through Iced and KentOS UI's
# snapshot feature; no new package (docs/adr/0021).
iced_runtime = { workspace = true }
rfd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# App boot and font-sensitive widget tests share a reentrant test-only guard.
parking_lot = "=0.12.5"
# Inflating the PDF's streams in the acceptance test's own reader (the plotter's tests/support/files.rs).
miniz_oxide = { workspace = true }
